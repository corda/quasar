import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
import static org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.javamodularity.moduleplugin'
    id 'java-library'
}

ext {
    moduleName = 'co.paralleluniverse.quasar.kotlin'
}

configurations.configureEach {
    resolutionStrategy {
        dependencySubstitution {
            substitute module('org.jetbrains.kotlin:kotlin-stdlib') using module("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
            substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') using module("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
            substitute module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') using module("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
            substitute module('org.jetbrains.kotlin:kotlin-stdlib-common') using module("org.jetbrains.kotlin:kotlin-stdlib-common:$kotlinVersion")
        }
    }
}

dependencies {
    implementation project(path: ':quasar-core', configuration: 'classic')
    implementation(project(':quasar-actors')) {
        exclude module: 'quasar-core'
    }

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
}

sourceSets {
    AnnotationTest {
        compileClasspath += files(main.compileClasspath, main.output, test.compileClasspath, test.output)
        runtimeClasspath += files(main.runtimeClasspath, test.runtimeClasspath)
    }
}

configurations {
    AnnotationTestImplementation.extendsFrom implementation
    AnnotationTestRuntimeOnly.extendsFrom runtimeOnly
}

def annotationTest = tasks.register('annotationTest', Test) {
    description = 'Custom Annotation Tests'
    group = 'verification'

    testClassesDirs = sourceSets.AnnotationTest.output.classesDirs
    classpath = sourceSets.AnnotationTest.runtimeClasspath
    shouldRunAfter tasks.named('test')

    doFirst {
        jvmArgs = jvmArgs.findAll {!it.contains("javaagent")}
        jvmArgs "-javaagent:${quasarJar}=a(SUSPENDABLE=co.paralleluniverse.kotlin.fibers.MySuspendable,co.paralleluniverse.kotlin.fibers.DennisSuspendable)"
        jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    }
}

tasks.named('check') {
    dependsOn annotationTest
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        jvmTarget = JVM_11
        apiVersion = KOTLIN_1_8
        languageVersion = KOTLIN_1_8
        allWarningsAsErrors = true
        // We need to enable this, but must watch for compiler warnings about
        // abstract methods in the base class not having an implementation!
        // See https://youtrack.jetbrains.com/issue/KT-46253
        freeCompilerArgs = [ '-Xjvm-default=all' ]
    }
}

classes {
    doLast {
        scanAndInstrument(sourceSets.main, [configurations.provided, configurations.runtimeClasspath])
    }
}
