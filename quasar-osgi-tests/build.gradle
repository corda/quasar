import aQute.bnd.gradle.Bundle
import aQute.bnd.gradle.Resolve
import aQute.bnd.gradle.TestOSGi
import java.nio.file.Files

import static org.gradle.jvm.toolchain.JavaLanguageVersion.of

plugins {
    id 'biz.aQute.bnd.builder' apply false
    id 'java-library'
}

sourceSets {
    osgiTest {
        java {
            srcDirs = [ 'src/osgi-test/java' ]
        }
        resources {
            srcDirs = [ 'src/osgi-test/resources' ]
        }
    }
}

configurations {
    bundles {
        canBeConsumed = false
        transitive = false
    }
    osgiTestCompileOnly.extendsFrom compileOnly

    osgiTestRuntimeClasspath {
        resolutionStrategy {
            dependencySubstitution {
                substitute module('de.javakaffee:kryo-serializers') using project(':quasar-osgi-tests:kryo-serializers')
            }
        }
    }
}

dependencies {
    bundles project('osgi-cacheable-one')
    bundles project('osgi-cacheable-two')
    bundles project('osgi-do-not-instrument')
    bundles project('osgi-kotlin-lambda')
    bundles project('osgi-multi-uninstrumented')
    bundles project('osgi-super-classes')
    bundles project('osgi-suspendable')
    bundles project('osgi-uninstrumented')

    osgiTestCompileOnly 'org.osgi:osgi.core'
    osgiTestImplementation project(path: ':quasar-core', configuration: 'frameworkExtension')
    osgiTestImplementation project(path: ':quasar-core', configuration: 'core')
    osgiTestImplementation project('osgi-annotation')
    osgiTestImplementation project('osgi-exception')
    osgiTestImplementation project('osgi-proxies')
    osgiTestImplementation project('osgi-security-config')
    osgiTestImplementation project('osgi-unprivileged')
    osgiTestImplementation "org.assertj:assertj-core:$assertjVersion"
    osgiTestImplementation "org.osgi:org.osgi.test.junit5:$osgiTestJunit5Version"
    osgiTestImplementation "org.junit.jupiter:junit-jupiter:$junitJupiterVersion"
    osgiTestRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitJupiterVersion"
    osgiTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    osgiTestRuntimeOnly "org.jetbrains.kotlin:kotlin-osgi-bundle:$kotlinVersion"
    osgiTestRuntimeOnly "org.apache.felix:org.apache.felix.framework:$felixVersion"
    osgiTestRuntimeOnly "org.apache.felix:org.apache.felix.configadmin:$felixConfigAdminVersion"
    osgiTestRuntimeOnly "org.apache.felix:org.apache.felix.log:$felixLogVersion"
    osgiTestRuntimeOnly "org.apache.felix:org.apache.felix.scr:$felixScrVersion"
    osgiTestRuntimeOnly "org.osgi:org.osgi.service.component:$osgiServiceComponentVersion"
    osgiTestRuntimeOnly "org.osgi:org.osgi.util.function:$osgiUtilFunctionVersion"
    osgiTestRuntimeOnly "org.osgi:org.osgi.util.promise:$osgiUtilPromiseVersion"
    osgiTestRuntimeOnly("org.apache.felix:org.apache.felix.framework.security:$felixSecurityVersion") {
        exclude group: 'org.osgi'
    }
    osgiTestRuntimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
}

def testingBundle = tasks.register('testingBundle', Bundle) {
    archiveBaseName = 'quasar-osgi-tests'
    from sourceSets.osgiTest.output
    sourceSet = sourceSets.osgiTest
    bundle {
        bnd """\
Test-Cases: \${classes;HIERARCHY_INDIRECTLY_ANNOTATED;org.junit.platform.commons.annotation.Testable;CONCRETE}
"""
    }
}

def resolve = tasks.register('resolve', Resolve) {
    dependsOn testingBundle
    bundles = files(
        sourceSets.osgiTest.runtimeClasspath,
        testingBundle
    )
    bndrun = file('tests.bndrun')
    outputBndrun = layout.buildDirectory.file('resolved-tests.bndrun')
    doFirst {
        //  bnd attempts to use ~/ for caching if this is unavailable the build will fail.
        System.setProperty('bnd.home.dir', "$rootDir/bnd")
    }
}

def osgiTestResources = tasks.named('processOsgiTestResources', ProcessResources) {
    from(configurations.bundles) {
        into 'META-INF'
        rename "(.*)-\\Q${version}\\E.jar", "\$1.jar"
    }
}

tasks.withType(TestOSGi).configureEach { task ->
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = of(testJavaVersion)
    }
    dependsOn osgiTestResources
    resultsDirectory = file("$testResultsDir/test")
    bundles = files(
        sourceSets.osgiTest.runtimeClasspath,
        testingBundle
    )
    bndrun = resolve.flatMap { it.outputBndrun }

    ext {
        cacheDirectory = provider {
            Files.createTempDirectory(task.temporaryDir.toPath(), "cache")
        }
    }
}

def testOSGi = tasks.register('testOSGi', TestOSGi) {
    ext {
        // Felix enables implicit boot delegation by default.
        bootDelegation = true
    }
}

def testOSGiWithoutBootDelegation = tasks.register('testOSGiWithoutBootDelegation', TestOSGi) {
    mustRunAfter testOSGi

    ext {
        bootDelegation = false
    }
}

tasks.named('jar', Jar) {
    enabled = false
}

tasks.named('test', Test) {
    dependsOn testOSGi, testOSGiWithoutBootDelegation
    enabled = false
}

tasks.named('check') {
    dependsOn testOSGi, testOSGiWithoutBootDelegation
}
