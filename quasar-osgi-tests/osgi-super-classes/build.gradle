plugins {
    id 'biz.aQute.bnd.builder'
    id 'java-library'
}

ext {
    moduleName = 'quasar.osgi.super.classes'
}

dependencies {
    compileOnly "org.osgi:osgi.annotation:$osgiVer"
    compileOnly project(path: ':quasar-core', configuration: 'bundleJar')
    api project(':quasar-osgi-tests:osgi-base')
}
